<html>
<head>
<title>Authentication Page</title>
<style>
div{
            width:700px;
            height:600px;
            border:3px solid black;
            border-radius:25px;
            background-color:#E6EEF1;
            transition-property:width;
            transition-property:height;
            transiton-duration:1s;
            display:inline-block;
            margin:10px;
            vertical-align:top;
        }
button{
            width:400px;
            height:40px;
            border-radius:25px;
            border:3px solid black;
            background-color:#01FFFF;
        }
        button:hover{
            background-color:#FF2400;
        }
label{
font-size:25px;
}
input{
            padding:10px;
            width:500px;
            height:30px;
            border-radius:25px;
            border:3px solid #37FD12;
        }
</style>
<body>
<center>
<div>
<h1>Login Page</h1>
<hr>
<label id="name">Name:</label>
<input type="text" id="name1" placeholder="Name..."><br><br><br>
<label id="Num">Mobile Number:</label>
<input type="text" id="numb" placeholder="Number..."><br><br><br>
<label id="Email">Email-ID:</label>
<input type="text" id="email" placeholder="Email..."><br><br><br>
<label id="Password">password:</label>
<input type="text" id="pass" placeholder="password..."><br><br><br>
<label id="Gender">Gender:</label>
<input type="text" id="gender" placeholder="Gender..."><br><br><br>
<label id="Birth">Date Of Birth:</label>
<input type="text" id="birth" placeholder="Date of Birth..."><br><br>
<button onclick="profilestore()">Submit</button><br><br>
<button onclick="window.location.href='food delivery app.html'">Login</button>
</div>
</center>
</body>
</html>
